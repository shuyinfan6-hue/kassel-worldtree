<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#05070a">
  <title>卡塞尔世界树球形徽章</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" aria-label="卡塞尔世界树球形徽章">
    <canvas id="emblem" aria-label="可拖动旋转的半繁荣半枯萎世界树"></canvas>
    <section class="title" aria-hidden="true">
      <p>KASSEL ACADEMY</p>
      <h1>世界树</h1>
      <span>拖动旋转 · 滚轮缩放 · 双击复位</span>
    </section>
    <button id="toggle" type="button" aria-label="暂停自动旋转">暂停</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
